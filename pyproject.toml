[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2-private-legal-triage"
version = "0.1.0"
description = "Local-first private legal document triage agent for PS2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.39,<2.0",
  "pymupdf>=1.24,<2.0",
  "pydantic>=2.8,<3.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
